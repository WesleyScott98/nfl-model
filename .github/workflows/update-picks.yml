name: Update picks

# All times UTC (Eastern is UTC-4 until Nov 1, then UTC-5 — everything shifts an hour earlier in ET).
#
#   DAY-BEFORE runs pull player props, since that's when you place bets:
#     Wed 00:00 Thu (8pm ET Wed)  -> Thursday night game
#     Sat 17:00    (1pm ET)       -> the whole Sunday slate
#     Sun 00:00 Mon (8pm ET Sun)  -> Monday night game
#
#   PRE-KICKOFF runs (~90 min out) refresh spreads, totals and moneylines only — cheap, and
#   prop prices barely move in the last hour anyway:
#     Thu 22:45 (6:45pm ET), Sun 15:30 (11:30am ET), Sun 18:45 (2:45pm ET),
#     Sun 22:50 (6:50pm ET), Mon 22:45 (6:45pm ET)
#
#   Wed 15:00 (11am ET) picks up the new week's schedule, injuries and roster moves.
#
# Budget: ~91 credits/week, ~390/month of the free 500.
on:
  schedule:
    - cron: "0 15 * * 3"      # Wed 11am ET  — new week's data, lines
    - cron: "0 0 * * 4"       # Wed 8pm ET   — TNF, day before, props
    - cron: "45 22 * * 4"     # Thu 6:45pm ET — TNF, ~90 min out, lines
    - cron: "0 17 * * 6"      # Sat 1pm ET   — Sunday slate, day before, props
    - cron: "30 15 * * 0"     # Sun 11:30am ET — 1pm games, ~90 min out, lines
    - cron: "45 18 * * 0"     # Sun 2:45pm ET  — 4pm games, ~90 min out, lines
    - cron: "50 22 * * 0"     # Sun 6:50pm ET  — SNF, ~90 min out, lines
    - cron: "0 0 * * 1"       # Sun 8pm ET   — MNF, day before, props
    - cron: "45 22 * * 1"     # Mon 6:45pm ET — MNF, ~90 min out, lines
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site
        env:
          NFL_SEASON: "2026"
          NFL_EDGE_CACHE: /tmp/nfl-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPS_WINDOW_HOURS: "30"
          # props on the three day-before runs and on any manual run; lines only otherwise
          ODDS_MODE: ${{ contains(fromJSON('["0 0 * * 4","0 17 * * 6","0 0 * * 1",""]'), github.event.schedule) && 'full' || 'lines' }}
        run: python build_site.py --out .
      - name: Commit if anything changed
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add index.html picks.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Picks refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying..."
            sleep 5
          done
          exit 1
