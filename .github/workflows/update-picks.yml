name: Update picks

# Times are UTC (Eastern is UTC-4 until Nov 1, then UTC-5).
#
# Props are now decided PER GAME, not per run: any game inside ~36 hours of kickoff whose prices
# haven't been pulled in the last 20 hours gets them, plus one final pull inside 4 hours. So if
# GitHub skips or delays a scheduled run — which it does on the free tier — the next run catches
# up instead of the slate going priceless. Runs are therefore cheap and redundant on purpose.
on:
  schedule:
    - cron: "0 15 * * 3"      # Wed 11am ET  — new week's data and lines
    - cron: "0 0 * * 4"       # Wed 8pm ET   — Thursday game comes into range
    - cron: "45 22 * * 4"     # Thu 6:45pm ET — final check before Thursday night
    - cron: "0 17 * * 6"      # Sat 1pm ET   — the Sunday slate comes into range
    - cron: "0 1 * * 0"       # Sat 9pm ET   — backstop if the 1pm run was skipped
    - cron: "30 13 * * 0"     # Sun 9:30am ET — backstop, and early inactive news
    - cron: "30 15 * * 0"     # Sun 11:30am ET — ~90 min before the 1pm games
    - cron: "45 18 * * 0"     # Sun 2:45pm ET — ~90 min before the 4pm games
    - cron: "50 22 * * 0"     # Sun 6:50pm ET — ~90 min before Sunday night
    - cron: "0 0 * * 1"       # Sun 8pm ET   — Monday game comes into range
    - cron: "45 22 * * 1"     # Mon 6:45pm ET — final check before Monday night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site
        env:
          NFL_SEASON: "2026"
          NFL_EDGE_CACHE: /tmp/nfl-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MODE: auto                # decide per game; no dependence on which cron fired
          PROPS_WINDOW_HOURS: "36"
          PROPS_REPULL_HOURS: "20"
          PROPS_FINAL_HOURS: "0"         # set to 4 for a near-kickoff prop refresh (paid odds plan)
        run: python build_site.py --out .
      - name: Commit if anything changed
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add index.html picks.json odds_state.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Picks refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying..."
            sleep 5
          done
          exit 1
