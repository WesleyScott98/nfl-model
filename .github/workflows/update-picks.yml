name: Update picks

# All times UTC. Eastern is UTC-4 through Nov 1, then UTC-5 (so these shift an hour later in ET
# for the back half of the season).
#   Wed 15:00 (11am ET) — new week's lines and data land        -> game lines only
#   Wed 00:00 Thu (8pm ET Wed) — ~24h before Thursday night     -> props for that game
#   Sat 17:00 (1pm ET) — ~24h before the Sunday slate           -> props for all Sunday games
#   Sun 16:45 (12:45pm ET) — inactives, final refresh           -> game lines only
#   Sun 00:00 Mon (8pm ET Sun) — ~24h before Monday night       -> props for that game
on:
  schedule:
    - cron: "0 15 * * 3"
    - cron: "0 0 * * 4"
    - cron: "0 17 * * 6"
    - cron: "45 16 * * 0"
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site
        env:
          NFL_SEASON: "2026"
          NFL_EDGE_CACHE: /tmp/nfl-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPS_WINDOW_HOURS: "30"
          # the two data-only runs take game lines only; the day-before runs pull player props
          ODDS_MODE: ${{ (github.event.schedule == '0 15 * * 3' || github.event.schedule == '45 16 * * 0') && 'lines' || 'full' }}
        run: python build_site.py --out .
      - name: Commit if anything changed
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add index.html picks.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Picks refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying..."
            sleep 5
          done
          exit 1
