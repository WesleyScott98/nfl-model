name: Update picks

on:
  schedule:
    - cron: "0 15 * * 3,6"
    - cron: "45 16 * * 0"
    - cron: "0 23 * * 0"
    - cron: "0 21 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site
        env:
          NFL_SEASON: "2026"
          NFL_EDGE_CACHE: /tmp/nfl-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MODE: ${{ (github.event.schedule == '0 15 * * 3,6') && 'lines' || 'full' }}
        run: python build_site.py --out .
      - name: Commit if anything changed
        run: |
          git config user.name "picks-bot"
          git config user.email "actions@github.com"
          git add index.html picks.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Picks refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying..."
            sleep 5
          done
          exit 1
